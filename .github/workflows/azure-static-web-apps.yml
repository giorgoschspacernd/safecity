name: Deploy στο Azure Static Web Apps

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   types: [ opened, synchronize, reopened, closed ]
  #   branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  accessibility:
    # Έλεγχος προσβασιμότητας (axe-core + HTML_CodeSniffer) πριν από κάθε deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx --yes playwright@1 install --with-deps chromium
      - run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -type f -name chrome -path "*chrome-linux*" | head -n 1) npm test

  build_and_deploy:
    needs: accessibility
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "src"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Κλείσιμο preview περιβάλλοντος
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
